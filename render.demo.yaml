# Draft; importing this Blueprint publishes a service and requires user approval.
services:
  - type: web
    name: astrasynq-synthetic-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile.demo
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /health/live
    envVars:
      - key: ASTRASYNQ_MODE
        value: production
      - key: ASTRASYNQ_DEMO_MODE
        value: 'true'
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_SESSION_HOURS
        value: '1'
      - key: ASTRASYNQ_ALLOW_PRIVATE_WEBHOOKS
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: ASTRASYNQ_DEMO_PASSWORD
        generateValue: true
