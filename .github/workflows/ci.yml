name: Release candidate checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrasynq
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: astrasynq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrasynq -d astrasynq_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://astrasynq:synthetic-ci-only@127.0.0.1:5432/astrasynq_test
      DATABASE_URL: postgresql+psycopg://astrasynq:synthetic-ci-only@127.0.0.1:5432/astrasynq_test
      ASTRASYNQ_MODE: test
      AUTH_COOKIE_SECURE: 'false'
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:4185,http://127.0.0.1:8012
      ASTRASYNQ_API_URL: http://127.0.0.1:8012
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install Python test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pip==26.2
          .venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL backend tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest tests -q
      - name: TypeScript, production build and packaging
        working-directory: frontend
        run: |
          pnpm build
          pnpm test:sites
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Application regression and portable landing smoke
        run: .venv/bin/python scripts/ci-browser.py
      - name: Release and public file checks
        run: |
          .venv/bin/python scripts/test-release-static.py
          .venv/bin/python scripts/check-public-files.py
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Python dependency advisories
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements-dev.txt
      - name: Frontend dependency advisories
        if: always()
        working-directory: frontend
        run: pnpm audit --audit-level moderate
